<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-label="Headway Travel Firm HTF logo">
  <defs>
    <linearGradient id="htf-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFD27A"/>
      <stop offset="50%" stop-color="#FF9A4D"/>
      <stop offset="100%" stop-color="#FF6B35"/>
    </linearGradient>
    <linearGradient id="htf-blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9ED3FF"/>
      <stop offset="100%" stop-color="#4A8DFF"/>
    </linearGradient>
    <radialGradient id="htf-glow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <g transform="translate(56 56)" filter="url(#softShadow)">
    <rect x="0" y="0" width="228" height="228" rx="64" fill="#101318" stroke="url(#htf-gold)" stroke-width="4"/>
    <circle cx="114" cy="114" r="92" fill="#0D1117" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="2"/>
    <circle cx="114" cy="114" r="92" fill="url(#htf-glow)"/>

    <path d="M54 130C72 109 91 98 114 98C137 98 156 109 174 130" fill="none" stroke="url(#htf-blue)" stroke-width="6" stroke-linecap="round"/>
    <path d="M164 128l18 2-10 14" fill="none" stroke="url(#htf-gold)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="62" cy="136" r="8" fill="url(#htf-gold)"/>
    <circle cx="114" cy="98" r="7" fill="url(#htf-blue)"/>

    <text x="114" y="140" text-anchor="middle" fill="#F4F4F4" font-family="Arial Black, Arial, Helvetica, sans-serif" font-size="58" font-weight="900" letter-spacing="3">HTF</text>
    <text x="114" y="168" text-anchor="middle" fill="#A7B1BD" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="5">HEADWAY</text>
  </g>

  <g transform="translate(324 98)">
    <text x="0" y="0" fill="#F4F4F4" font-family="Arial Black, Arial, Helvetica, sans-serif" font-size="54" font-weight="900" letter-spacing="1">Headway Travel Firm</text>
    <text x="2" y="56" fill="#A0A0A0" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="500" letter-spacing="6">EDUCATION &amp; TRAVEL CONSULTANCY</text>
    <rect x="2" y="82" width="120" height="4" rx="2" fill="url(#htf-gold)"/>
    <text x="2" y="132" fill="#D9DEE6" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="600" letter-spacing="0.2">Build | Guide | Deliver</text>
  </g>
</svg>
